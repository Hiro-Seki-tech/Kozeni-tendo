<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLIP 3段階連動ボタン v5</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  background: #020617;
  color: #f8fafc;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  overflow: hidden;
  background: transparent;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Yu Gothic UI", "Meiryo", sans-serif;
}
.plip-wrap {
  position: relative;
  width: 100%;
  height: 100%;
  aspect-ratio: 1 / 1;
  user-select: none;
}
#plip-core-button {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  overflow: hidden;
  border: 2px solid #FFD700;
  border-radius: 18px;
  cursor: pointer;
  background: linear-gradient(135deg, #475569, #1e293b, #0f172a);
  box-shadow: 0 0 28px #FFD70055, 0 18px 45px rgba(0,0,0,.5);
  transition: border-color .2s, box-shadow .2s;
  touch-action: manipulation;
}
#plip-stage, #plip-stage > svg, #plip-stage > img, #plip-stage > video {
  display: block;
  width: 100%;
  height: 100%;
}
 #plip-stage > img, #plip-stage > video { object-fit: contain; }
 #plip-stage { position: relative; overflow: hidden; }
 #plip-stage > video, #plip-stage > .plip-video-poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
 #plip-stage > .plip-video-poster { z-index: 2; pointer-events: none; transition: opacity .5s ease; }
 #plip-stage > .plip-video-poster.is-hidden { opacity: 0; }
.plip-bubble {
  display: none;
  position: absolute;
  top: calc(100% - 5px);
  left: 0;
  width: 100%;
  z-index: 50;
  padding: 0 1px;
  pointer-events: none;
}
.plip-bubble svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}
@keyframes plipNobleFloatSVG {
  0%, 100% { transform: translate3d(0,0,0) rotate(.001deg); }
  50% { transform: translate3d(0,2px,0) rotate(.001deg); }
}
@keyframes plipRainbowTextSVG {
  0% { fill: #ff0055; filter: drop-shadow(0 0 3px rgba(255,0,85,.5)); }
  14% { fill: #ff5500; }
  28% { fill: #ffcc00; }
  42% { fill: #00ff66; }
  56% { fill: #00ccff; }
  70% { fill: #3333ff; }
  84% { fill: #9900ff; }
  100% { fill: #ff0055; filter: drop-shadow(0 0 3px rgba(255,0,85,.5)); }
}
@keyframes plipBoltFlashSVG {
  0%, 100% { opacity: .85; filter: drop-shadow(0 0 1px #fde047); }
  50% { opacity: 1; filter: drop-shadow(0 0 5px #fde047); }
}
.animated-bubble-container-svg {
  animation: plipNobleFloatSVG 3s infinite ease-in-out;
  transform-box: fill-box;
  transform-origin: center;
}
.rainbow-bulb-svg { animation: plipRainbowTextSVG 7s linear infinite; }
.flashing-bolt-svg { animation: plipBoltFlashSVG 1.5s infinite ease-in-out; }
.effect-press { animation: effectPress .26s ease-out; }
.effect-pulse { animation: effectPulse .42s ease-out; }
.effect-glow { animation: effectGlow .55s ease-out; }
.effect-shake { animation: effectShake .42s ease-out; }
.effect-flash { animation: effectFlash .42s ease-out; }
.effect-spin { animation: effectSpin .55s ease-in-out; }
.effect-bounce { animation: effectBounce .55s ease-out; }
.effect-tilt { animation: effectTilt .55s ease-in-out; }
@keyframes effectSpin { 0% {transform:rotate(0)} 55% {transform:rotate(15deg) scale(.94)} 100% {transform:rotate(0)} }
@keyframes effectBounce { 0%,100% {transform:translateY(0) scale(1)} 35% {transform:translateY(-15px) scale(1.03)} 65% {transform:translateY(5px) scale(.97)} }
@keyframes effectTilt { 0%,100% {transform:rotate(0)} 25% {transform:rotate(-7deg)} 65% {transform:rotate(7deg)} }

@keyframes effectPress {
  0% { transform: scale(1) translateY(0); }
  45% { transform: scale(.94) translateY(8px); filter: brightness(1.25); }
  100% { transform: scale(1) translateY(0); }
}
@keyframes effectPulse {
  0% { transform: scale(1); }
  42% { transform: scale(1.06); }
  100% { transform: scale(1); }
}
@keyframes effectGlow {
  0% { filter: brightness(1); }
  45% { filter: brightness(1.8) saturate(1.35); }
  100% { filter: brightness(1); }
}
@keyframes effectShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-10px) rotate(-1deg); }
  40% { transform: translateX(9px) rotate(1deg); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(4px); }
}
@keyframes effectFlash {
  0% { opacity: 1; }
  35% { opacity: .18; filter: brightness(2.5); }
  100% { opacity: 1; }
}
#plip-toast {
  display: none;
  position: fixed;
  top: 18px;
  right: 18px;
  z-index: 1000;
  max-width: min(390px, calc(100vw - 36px));
  padding: 12px 15px;
  border: 1px solid #334155;
  border-radius: 12px;
  background: #0f172a;
  color: #f8fafc;
  box-shadow: 0 14px 35px rgba(0,0,0,.45);
  opacity: 0;
  transform: translateY(-16px);
  pointer-events: none;
  transition: .25s;
  font-size: 14px;
}
#plip-toast.show {
  opacity: 1;
  transform: translateY(0);
}
</style>

  const TRANSITIONS = [{"sound":"speech","speech":{"text":"song","lang":"ja-JP","rate":1.2,"pitch":0.1,"volume":1}},{"sound":"speech","speech":{"text":"オフ","lang":"ja-JP","rate":1,"pitch":0.2,"volume":1}},{"sound":"speech","speech":{"text":"BGM","lang":"ja-JP","rate":1.2,"pitch":0,"volume":1}}];
  const EFFECT = "press";
  const THEME_FORMAT = "mp3";
  const LINK_MODE = true;
  const MUSIC_VOLUME = 0.50;
  const queryParams = new URLSearchParams(window.location.search);
  const linkCardTitle = queryParams.get("title") || "作品";
  const requestedMusicBase = queryParams.get("musicBase") || "./music/";

  function musicPath(filename) {
    const base = requestedMusicBase.endsWith("/")
      ? requestedMusicBase
      : requestedMusicBase + "/";
    return base + filename;
  }

  let currentState = 0;
  let managedAudio = null;
  let toastTimer = null;
  let sharedAudioContext = null;
  let themeLoopTimer = null;
  let musicSessionId = 0;

  const button = document.getElementById("plip-core-button");
  const stage = document.getElementById("plip-stage");
  const toast = document.getElementById("plip-toast");

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
  }

  function stopMediaInDocument(targetDocument) {
    try {
      targetDocument.querySelectorAll("audio, video:not([data-plip-visual-video])").forEach(media => {
        try {
          media.pause();
          media.currentTime = 0;
        } catch (_) {}
      });

      targetDocument.querySelectorAll("[data-plip-managed-audio='true']")
        .forEach(element => element.remove());

      targetDocument.querySelectorAll("iframe").forEach(frame => {
        try {
          frame.contentWindow.postMessage({ type: "PLIP_STOP_AUDIO" }, "*");
        } catch (_) {}
      });
    } catch (_) {}
  }

  function stopManagedMusic() {
    musicSessionId += 1;

    if (themeLoopTimer) {
      clearTimeout(themeLoopTimer);
      themeLoopTimer = null;
    }

    if (managedAudio) {
      try { managedAudio.pause(); } catch (_) {}
      managedAudio.remove();
      managedAudio = null;
    }

    stopMediaInDocument(document);

    // 通常版のみ：親ページ側のメディア停止も担当する。
    // LINK HP対応版では、他のiframeを止める役目は親LINK HPに任せる。
    // 子ボタンから parent.document を走査すると、GitHub Pagesなど
    // 同一オリジン環境で自分自身にも PLIP_STOP_AUDIO が返る場合がある。
    if (!LINK_MODE) {
      try {
        if (window.parent && window.parent !== window) {
          stopMediaInDocument(window.parent.document);
        }
      } catch (_) {}
    }
  }

  function getAudioContext() {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) return null;

    if (!sharedAudioContext || sharedAudioContext.state === "closed") {
      sharedAudioContext = new AudioContextClass();
    }
    return sharedAudioContext;
  }

  function tone(context, frequency, start, duration,
                type = "sine", volume = .1) {
    const oscillator = context.createOscillator();
    const gain = context.createGain();

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, start);
    gain.gain.setValueAtTime(volume, start);
    gain.gain.exponentialRampToValueAtTime(.0001, start + duration);

    oscillator.connect(gain).connect(context.destination);
    oscillator.start(start);
    oscillator.stop(start + duration);
  }

    if (setting.sound === "none") return;

    if (setting.sound === "speech") {
      if (!("speechSynthesis" in window)) return;

      const utterance = new SpeechSynthesisUtterance(setting.speech.text);

      const matchingVoice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase() === utterance.lang.toLowerCase())
        || speechSynthesis.getVoices().find(v => v.lang.toLowerCase().startsWith(utterance.lang.slice(0, 2).toLowerCase()));
      if (matchingVoice) utterance.voice = matchingVoice;
      utterance.rate = setting.speech.rate;
      utterance.pitch = setting.speech.pitch;
      utterance.volume = setting.speech.volume;
      speechSynthesis.speak(utterance);
      return;
    }

    const context = getAudioContext();
    if (!context) return;

    if (context.state === "suspended") {
      context.resume();
    }

    const time = context.currentTime;

    if (setting.sound === "click") {
      tone(context, 850, time, .035, "sine", .12);
    } else if (setting.sound === "digital") {
      tone(context, 620, time, .07, "square", .08);
      tone(context, 980, time + .07, .09, "square", .07);
    } else if (setting.sound === "confirm") {
      tone(context, 523.25, time, .10, "sine", .10);
      tone(context, 783.99, time + .09, .16, "sine", .10);
    } else if (setting.sound === "metallic") {
      tone(context, 1300, time, .07, "triangle", .07);
      tone(context, 1780, time + .018, .11, "triangle", .05);
    } else if (setting.sound === "impact") {
      tone(context, 120, time, .16, "sine", .18);
      tone(context, 65, time + .03, .22, "triangle", .09);
    } else if (setting.sound === "sparkle") {
      [880, 1174, 1568, 2093].forEach((frequency, index) => {
        tone(context, frequency, time + index * .055,
             .16, "sine", .06);
      });
    } else if (setting.sound === "chime") {
      tone(context, 659.25, time, .22, "sine", .09);
      tone(context, 987.77, time + .12, .32, "sine", .08);
    } else if (setting.sound === "laser") {
      [1250, 980, 720, 490].forEach((f, i) => tone(context, f, time + i * .045, .085, "sawtooth", .045));
    } else if (setting.sound === "bell") {
      tone(context, 783.99, time, .48, "sine", .10);
      tone(context, 1567.98, time, .32, "sine", .035);
    }
  }

  function runEffect() {
    if (EFFECT === "none") return;

    const className = "effect-" + EFFECT;
    button.classList.remove(className);
    void button.offsetWidth;
    button.classList.add(className);
    button.addEventListener("animationend", () => {
      button.classList.remove(className);
    }, { once: true });
  }

  function createManagedAudio(source, loop = false) {
    const audio = document.createElement("audio");
    audio.src = source;
    audio.loop = loop;
    audio.volume = MUSIC_VOLUME;
    audio.preload = "auto";
    audio.dataset.plipManagedAudio = "true";
    audio.style.display = "none";
    document.body.appendChild(audio);
    managedAudio = audio;
    return audio;
  }

  function randomChoice(items) {
    return items[Math.floor(Math.random() * items.length)];
  }

  async function playSourceWithFallback(primarySource, fallbackSource, options = {}) {
    const sessionId = options.sessionId;
    const loop = Boolean(options.loop);
    const onEnded = options.onEnded;

    async function attempt(source, isFallback) {
      if (sessionId !== musicSessionId) return false;

      const audio = createManagedAudio(source, loop);

      if (typeof onEnded === "function") {
        audio.addEventListener("ended", () => {
          if (sessionId !== musicSessionId) return;
          onEnded();
        }, { once: true });
      }

      try {
        await audio.play();

        if (LINK_MODE && sessionId === musicSessionId && (currentState === 0 || currentState === 1)) {
          window.parent.postMessage({
            type: "PLIP_TRACK_PLAYING",
            title: encodeURIComponent(linkCardTitle),
            trackUrl: audio.currentSrc || audio.src || source
          }, "*");
        }

        return true;
      } catch (_) {
        if (managedAudio === audio) {
          audio.remove();
          managedAudio = null;
        }

        if (!isFallback && primarySource !== fallbackSource) {
          return attempt(fallbackSource, true);
        }
        return false;
      }
    }

    return attempt(primarySource, false);
  }

  async function playMusicForState(state) {
    const sessionId = musicSessionId;

    if (state.musicMode === "silent") {
      if (LINK_MODE && sessionId === musicSessionId) {
        window.parent.postMessage({
          type: "PLIP_TRACK_PLAYING",
          title: encodeURIComponent(linkCardTitle),
          trackUrl: "サウンドオフ"
        }, "*");
      }
      showToast("🔇 音楽をオフにしました");
      return;
    }

    if (state.musicMode === "ambient") {
      const chosen = randomChoice([
        musicPath("bgm.mp3"),
        musicPath("bgm1.mp3")
      ]);

      const played = await playSourceWithFallback(
        chosen,
        musicPath("bgm.mp3"),
        { loop: true, sessionId }
      );

      if (sessionId !== musicSessionId) return;
      showToast(played
        ? "🌿 BGMを再生：" + chosen.split("/").pop()
        : "⚠️ BGMを再生できません");
      return;
    }

    const themeSources = [
      musicPath("song." + THEME_FORMAT),
      musicPath("song1." + THEME_FORMAT),
      musicPath("song2." + THEME_FORMAT),
      musicPath("song3." + THEME_FORMAT),
      musicPath("song4." + THEME_FORMAT)
    ];

    const playNextTheme = async () => {
      if (sessionId !== musicSessionId || currentState !== 1) return;

      const chosen = randomChoice(themeSources);
      const played = await playSourceWithFallback(
        chosen,
        musicPath("song." + THEME_FORMAT),
        {
          loop: false,
          sessionId,
          onEnded: () => {
            if (sessionId !== musicSessionId || currentState !== 1) return;
            themeLoopTimer = setTimeout(() => {
              themeLoopTimer = null;
              playNextTheme();
            }, 3000);
          }
        }
      );

      if (sessionId !== musicSessionId || currentState !== 1) return;
      showToast(played
        ? "🎵 主題歌を再生：" + chosen.split("/").pop()
        : "⚠️ 主題歌を再生できません");
    };

    await playNextTheme();
  }

   function renderVisual(state) {
    stage.querySelectorAll("video").forEach(video => video.pause());
    if (!state.mediaType || state.mediaType === "svg") {
      stage.innerHTML = state.svg;
    } else {
      stage.replaceChildren();
      const visual = document.createElement(state.mediaType === "video" ? "video" : "img");
      visual.src = state.mediaData;
       if (state.mediaType === "video") {
        if (state.posterData) {
          const still = document.createElement("img");
          still.className = "plip-video-poster";
          still.alt = "動画読み込み中の初期画像";
          still.src = state.posterData;
          stage.appendChild(still);
        }
        visual.muted = true;
       visual.defaultMuted = true;
       visual.loop = true;
       visual.autoplay = true;
       visual.playsInline = true;
       visual.preload = "metadata";
       visual.dataset.plipVisualVideo = "true";
      } else {
       visual.alt = "シンボル画像";
      }
      stage.appendChild(visual);
       if (state.mediaType === "video" && state.posterData) {
         // 初回自動再生とクリック後の再生、両方に対応する。
         const reveal = () => {
           if (!visual.isConnected || visual.paused || visual.readyState < 2) return;
           const still = stage.querySelector(".plip-video-poster");
           if (!still || still.classList.contains("is-hidden")) return;
           still.classList.add("is-hidden");
           still.addEventListener("transitionend", () => still.remove(), { once: true });
         };
         visual.addEventListener("playing", reveal);
         visual.addEventListener("timeupdate", reveal);
         reveal();
       }
    }
   }

   async function applyState(withSound = true, transitionIndex = 0) {
    const state = STATES[currentState];

    renderVisual(state);
    button.style.borderColor = state.color;
    button.style.boxShadow =
      "0 0 28px " + state.color +
      "55, 0 18px 45px rgba(0,0,0,.5)";

    runEffect();

    if (withSound) {
       stopManagedMusic();
      playClickSound(TRANSITIONS[transitionIndex]);
      const visualVideo = stage.querySelector("video[data-plip-visual-video]");
      if (visualVideo) visualVideo.play().catch(() => {});
      await playMusicForState(state);
    }
  }

  button.addEventListener("click", () => {
    const transitionIndex = currentState;
    currentState = (currentState + 1) % STATES.length;
    applyState(true, transitionIndex);

    if (LINK_MODE && window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: "PLIP_BUTTON_CLICK",
        title: encodeURIComponent(linkCardTitle),
        stateValue: currentState
      }, "*");
    }
  });

  window.addEventListener("message", event => {
    if (event.data && event.data.type === "PLIP_STOP_AUDIO") {
       stopManagedMusic();
      stage.querySelectorAll("video[data-plip-visual-video]").forEach(video => video.pause());
    }
  });

  applyState(false, 0);
})();
</script>
